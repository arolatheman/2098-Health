<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2098 Health</title>
    <script src="https://kit.fontawesome.com/6b7ab7aaf7.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header Section -->
     <header></header>
    <!-- Main Section -->
     <main>
        <!-- Make an Appointment Section -->
        <Section>
            <div>
                <img src="./images/appointment-image.jpg" alt="Doctor folding hands">
            </div>
            <div>
                <h2>Make an appointment</h2>
                <form action="">
                    <div>
                        <!-- Name Section -->
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Full Name" required>
                        <!-- Email section -->
                        </div>
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Your Email" required>
                        <div>
                    </div>
                    <div>
                        <!-- Date section -->
                        <div>
                            <label for="date">Select Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <!-- Department Section -->
                        <div>
                            <label for="department"> Select Department</label>
                            <select name="dept" id="dept" required>
                                <option value="Medical">Medical</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Science">Science</option>
                                <option value="Finance">Finance</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <!-- Phone number section -->
                        <label for="PhoneNumber">Phone Number</label>
                        <input type="tel" id="PhoneNumber" placeholder="Phone" required>
                    </div>
                    <div>
                        <!-- Message section -->
                        <label for="message">Additional Message</label>
                        <textarea name="message" id="message" cols="30" rows="10" placeholder="Message"></textarea>
                    </div>
                    <div>
                        <!-- Submit button -->
                        <input type="submit" value="Submit">
                    </div>
                </form>
            </div>
        </Section> 
     </main>
    <!-- Footer Section -->
     <footer></footer>
</body>
</html>
